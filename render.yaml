services:
  - type: redis
    name: api-rate-limiter-redis
    plan: free
    ipAllowList: []

  - type: web
    name: api-rate-limiter-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: api-rate-limiter-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_UPSTREAM
        fromService:
          type: web
          name: api-rate-limiter-backend
          property: hostport