# Minimal Render Blueprint for the three-service stack (Redis + backend + frontend).
# Deploy via Render: New + -> Blueprint -> select this repository.
# Values marked `sync: false` are prompted for at deploy time; no secrets live here.
services:
  # Managed Redis. After creation, copy the instance's internal hostname
  # into the backend's SPRING_DATA_REDIS_HOST when prompted below.
  - type: redis
    name: api-rate-limiter-redis
    plan: free # adjust to your preferred plan
    ipAllowList: [] # private access only (backend connects over Render's network)

  # Spring Boot API. Listens on Render's PORT via server.port=${PORT:8080}.
  - type: web
    name: api-rate-limiter-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATA_REDIS_HOST
        sync: false # internal hostname of the Redis instance above
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # production frontend origin, e.g. https://<frontend>.onrender.com

  # nginx-served dashboard. Proxies /api to the backend over Render's internal
  # network, so the React bundle keeps using relative URLs by default.
  - type: web
    name: api-rate-limiter-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: BACKEND_UPSTREAM
        fromService:
          type: web
          name: api-rate-limiter-backend
          property: hostport
