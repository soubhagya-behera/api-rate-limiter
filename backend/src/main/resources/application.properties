spring.application.name=api-rate-limiter

# Listen on the deployment-provided PORT; default 8080 for local/Docker use.
server.port=${PORT:8080}

# CORS origins allowed to call /api/** (comma-separated). Override with CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Redis connection. Override with SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Rate limiter defaults. Override with RATE_LIMIT_MAX_REQUESTS / RATE_LIMIT_WINDOW_SECONDS / RATE_LIMIT_KEY_PREFIX.
rate-limit.max-requests=5
rate-limit.window-seconds=60
rate-limit.key-prefix=rate-limit:ip

# Actuator: expose only health and info over HTTP. No env/beans/configprops/mappings/loggers/threaddump/heapdump.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.info.env.enabled=true

# /actuator/info content (non-sensitive only).
info.app.name=api-rate-limiter
info.app.description=Redis-backed API rate limiting service