services:
  redis:
    image: redis:latest
    container_name: api-rate-limiter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    image: api-rate-limiter-backend:latest
    container_name: api-rate-limiter-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Connect to Redis via the Compose service name (no hardcoded values in Java code).
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: api-rate-limiter-frontend:latest
    container_name: api-rate-limiter-frontend
    restart: unless-stopped
    ports:
      # Host 5173 (dev-compatible) -> nginx listening on 80 inside the container.
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis-data:
